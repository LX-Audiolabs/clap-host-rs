[package]
name = "clap-host-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "clap-host-rs"
path = "src/main.rs"

[dependencies]
clap-host-core = { path = "../clap-host-core" }
midir = "0.11"
raw-window-handle = "0.6"
rfd = "0.15"
slint = { version = "=1.17.1", default-features = true, features = ["backend-winit", "renderer-femtovg", "compat-1-2", "raw-window-handle-06"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }

[features]
# ASIO audio backend (cpal). Build-time requirements beyond a normal build:
# the Steinberg ASIO SDK, pointed to by the CPAL_ASIO_DIR env var, plus
# LLVM/Clang for bindgen (LIBCLANG_PATH). See cpal's README ("ASIO on Windows").
default = []
asio = ["clap-host-core/asio"]

[build-dependencies]
slint-build = "=1.17.1"
