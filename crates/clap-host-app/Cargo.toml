[package]
name = "clap-host-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "clap-host-rs"
path = "src/main.rs"

[dependencies]
clap-host-core = { path = "../clap-host-core" }
midir = "0.11"
slint = { version = "=1.17.1", default-features = true, features = ["backend-winit", "renderer-femtovg", "compat-1-2"] }

[build-dependencies]
slint-build = "=1.17.1"
