[package]
name = "clap-host-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "clap-host-rs"
path = "src/main.rs"

[dependencies]
clap-host-core = { path = "../clap-host-core" }
midir = "0.11"
raw-window-handle = "0.6"
slint = { version = "=1.17.1", default-features = true, features = ["backend-winit", "renderer-femtovg", "compat-1-2", "raw-window-handle-06"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }

[build-dependencies]
slint-build = "=1.17.1"
