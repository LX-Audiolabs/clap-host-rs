[workspace]
resolver = "3"
members = ["crates/clap-host-core", "crates/clap-host-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/lxndrbe/clap-host-rs"
authors = ["lxndrbe"]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
